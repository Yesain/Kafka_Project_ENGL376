<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gregor Samsa Staff File</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concept: the firm's office floor plan. The home screen is a picture of all rooms; each room opens one page of Gregor's staff file. Warm yellow and beige, soft type, and little text until the viewer clicks. */
:root {
  --bg: #FBF4E2;
  --card: #FFFBF0;
  --ink: #4B4030;
  --muted: #7C6F5A;
  --rule: #EADFC6;
  --soft: #F6E8BE;
  --soft-2: #F0E2CC;
  --hover: #EBD9A6;
  --sel-bg: #8C6A1E;
  --sel-fg: #FFFFFF;
  --calm: #8EAA72;
  --shock: #D58A66;
  --shadow: 0 8px 28px rgba(120, 95, 40, .10);
  --f: "Times New Roman", Times, "Liberation Serif", "Nimbus Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2B261D; --card: #362F23; --ink: #F2EAD7; --muted: #BFB296; --rule: #4A4130;
    --soft: #4B412A; --soft-2: #433A2E; --hover: #5B4E30; --sel-bg: #E3C26B; --sel-fg: #2B261D;
    --calm: #A3C086; --shock: #E6A07F; --shadow: 0 8px 28px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2B261D; --card: #362F23; --ink: #F2EAD7; --muted: #BFB296; --rule: #4A4130;
  --soft: #4B412A; --soft-2: #433A2E; --hover: #5B4E30; --sel-bg: #E3C26B; --sel-fg: #2B261D;
  --calm: #A3C086; --shock: #E6A07F; --shadow: 0 8px 28px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 19px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 56px;
}
.wrap { max-width: 880px; margin: 0 auto; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(1.7rem, 5vw, 2.6rem); font-weight: 800; line-height: 1.15; text-wrap: balance; }
h2 { font-size: clamp(1.5rem, 4.2vw, 2rem); font-weight: 800; line-height: 1.2; text-wrap: balance; }
h3 { font-size: 1.15rem; font-weight: 700; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
:focus-visible { outline: 3px solid var(--sel-bg); outline-offset: 3px; }
button { font-family: inherit; }

.btn, .chip, summary.more-sum {
  font: inherit; font-size: 17px; font-weight: 600; color: var(--ink); background: var(--soft);
  border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; min-height: 42px; line-height: 1.3;
}
.btn:hover, .chip:hover, summary.more-sum:hover { background: var(--hover); }
.chip[aria-pressed="true"], .btn.primary { background: var(--sel-bg); color: var(--sel-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, summary.more-sum, .plan .room { transition: background .2s, fill .2s; } }

details.more { margin-top: 14px; }
details.more > summary { list-style: none; display: inline-flex; align-items: center; gap: 8px; }
details.more > summary::-webkit-details-marker { display: none; }
summary.more-sum::before { content: "+"; font-weight: 800; width: 1em; text-align: center; }
details[open] > summary.more-sum::before { content: "\2212"; }
.more-body { margin-top: 12px; padding: 16px 18px; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); max-width: 62ch; }
.more-body p + p { margin-top: 10px; }
.more-body ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; }

.top { margin-bottom: 26px; }
.hero { display: grid; gap: 12px; margin-bottom: 22px; }

/* floor plan */
.plan-head { display: grid; gap: 4px; margin-bottom: 14px; }
.plan { display: block; width: 100%; height: auto; }
.plan.narrow { display: none; }
@media (max-width: 640px) { .plan.wide { display: none; } .plan.narrow { display: block; max-width: 420px; margin: 0 auto; } }
.plan .shell { fill: var(--card); stroke: var(--rule); stroke-width: 4; }
.plan .room { fill: var(--soft); stroke: var(--rule); stroke-width: 2; }
.plan .room.b { fill: var(--soft-2); }
.plan .door { fill: var(--card); }
.plan .hall { stroke: var(--rule); stroke-width: 3; stroke-dasharray: 6 9; }
.plan .num { fill: var(--card); }
.plan text { font-family: var(--f); fill: var(--ink); }
.plan .t { font-weight: 800; }
.plan .hnt { fill: var(--muted); font-weight: 600; }
.plan .ico { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
.plan .room-g { cursor: pointer; outline: none; }
.plan .room-g:hover .room, .plan .room-g:focus-visible .room { fill: var(--hover); }
.plan .room-g:focus-visible .room { stroke: var(--sel-bg); stroke-width: 4; }

.room-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
.room-head { display: grid; gap: 8px; margin-bottom: 24px; }
.room-head p.lead { color: var(--muted); max-width: 56ch; }
.panel { background: var(--card); border-radius: 24px; padding: 24px; box-shadow: var(--shadow); }
.stage { margin-top: 22px; display: grid; gap: 8px; align-content: start; min-height: 110px; }
.stage .where { font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: .03em; }
.stage blockquote { margin: 0; font-size: clamp(1.3rem, 3.6vw, 1.75rem); font-weight: 700; line-height: 1.3; max-width: 30ch; }
.stage .hint-line { color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 34px; }

.chart-wrap { overflow-x: auto; margin-top: 18px; }
.chart-wrap svg { display: block; min-width: 520px; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 15px; }
.legend span::before { content: ""; display: inline-block; width: 22px; height: 6px; border-radius: 3px; margin-right: 8px; vertical-align: middle; background: var(--c); }

.reader { font-size: clamp(1.3rem, 3.6vw, 1.75rem); font-weight: 700; line-height: 1.4; max-width: 30ch; min-height: 3.6em; }
.reader .w { display: inline-block; margin-right: .38em; opacity: .22; transition: opacity .25s, transform .25s, color .25s; }
.reader .w.on { opacity: 1; }
.reader.drama .w.on { transform: scale(1.05); color: var(--shock); }
.say { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 22px; }
.opt { background: var(--soft); border-radius: 20px; padding: 18px; display: grid; gap: 12px; align-content: start; }
.opt:nth-child(2) { background: var(--soft-2); }
.opt .bars { display: flex; align-items: end; gap: 4px; height: 40px; }
.opt .bars i { display: block; width: 6px; border-radius: 3px; background: var(--calm); }
.opt:nth-child(2) .bars i { background: var(--shock); }
@media (max-width: 560px) { .say { grid-template-columns: minmax(0, 1fr); } }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 22px; }
.person { text-align: left; background: var(--soft); border: 0; border-radius: 20px; padding: 18px; cursor: pointer; color: var(--ink); display: grid; gap: 8px; align-content: start; min-height: 120px; }
.person:nth-child(even) { background: var(--soft-2); }
.person:hover { background: var(--hover); }
.person strong { font-size: 1.15rem; font-weight: 800; }
.person .role { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.person .more-text { font-size: 15px; line-height: 1.5; }
@media (max-width: 800px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 440px) { .board { grid-template-columns: minmax(0, 1fr); } }

.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.duo .chip { border-radius: 20px; padding: 16px 18px; font-size: 17px; font-weight: 700; }
.pane { margin-top: 22px; }
.pane > .hint-line { color: var(--muted); }
.refs { display: grid; gap: 16px; font-size: 15px; }
.ref { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: start; }
.ref .ph { width: 76px; height: 76px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-weight: 800; font-size: 20px; color: var(--muted); overflow: hidden; }
.ref .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ref p { padding-left: 1.27cm; text-indent: -1.27cm; overflow-wrap: anywhere; }
.fine { font-size: 14px; color: var(--muted); }
</style>

<body>
<div class="wrap">
  <div class="top"><span class="eyebrow">ENGL.376.600 · Nurmukhambet Yersain</span></div>

  <div id="homeView">
    <header class="hero">
      <h1>The Calm Horror of The Metamorphosis</h1>
      <div id="thesisBox"></div>
    </header>
    <div class="plan-head">
      <h2>All rooms</h2>
      <p class="muted">Click a room to enter.</p>
    </div>
    <div id="planBox"></div>
  </div>

  <div id="roomView" hidden></div>
</div>

<script>

  /* ---------- helpers ---------- */
  function h(tag, props) {
    var e = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
    for (var k in (props || {})) {
      if (k === "class") e.className = props[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    }
    (function add(list) {
      list.forEach(function (c) {
        if (c == null || c === false) return;
        if (Array.isArray(c)) return add(c);
        e.appendChild(c.nodeType ? c : document.createTextNode(c));
      });
    })(kids);
    return e;
  }
  function reveal(label, body) {
    return h("details", { class: "more" }, h("summary", { class: "more-sum" }, label), h("div", { class: "more-body" }, body));
  }
  function chips(labels, onPick) {
    var wrap = h("div", { class: "chips", role: "group" }), list = [];
    labels.forEach(function (l, i) {
      var b = h("button", { type: "button", class: "chip", "aria-pressed": "false" }, l);
      b.addEventListener("click", function () { pick(i); });
      wrap.appendChild(b); list.push(b);
    });
    function pick(i) {
      list.forEach(function (b, j) { b.setAttribute("aria-pressed", j === i ? "true" : "false"); });
      onPick(i);
    }
    return { el: wrap, pick: pick };
  }

  /* ---------- data ---------- */
  var record = [
    { s: "On duty", part: "Part I", pg: "p. 4", q: "what an exhausting profession I've chosen", n: "Gregor complains about his job before he thinks about his new body. Warner (2007, p. 1026) sees an early sign of alienation. Robertson (2004, p. 51) calls it self-estrangement caused by the demands of work." },
    { s: "Absent", part: "Part I", pg: "pp. 8–10", q: "let me permit myself to note", n: "The general manager uses formal office language. He says, \"I have always known you as a calm, sensible person\" (p. 10). Gregor is judged as an employee while he lies in bed as an insect." },
    { s: "Pleading", part: "Part I", pg: "p. 14", q: "No one loves us drummers", n: "Gregor talks like a salesman, \"the only one who had retained his composure\" (p. 14). Weninger (1993, p. 271): Gregor is composed, so the reader feels the shock." },
    { s: "Provider", part: "Part II", pg: "p. 22", q: "the exchange no longer felt particularly warm", n: "Gregor pays for the whole family. The family takes the money and gives little back. Weninger (1993, p. 272) describes him as the breadwinner." },
    { s: "Tolerated", part: "Part III", pg: "p. 32", q: "only tolerance", n: "After the apple wound, duty asks the family to swallow its disgust and show him \"only tolerance\". Care becomes a duty." },
    { s: "Disposed", part: "Part III", pg: "p. 41", q: "get rid of it", n: "Grete says \"it\". Note 1 on this page explains the German pronoun es. The worker who can no longer earn becomes a thing." },
    { s: "Closed", part: "Part III", pg: "pp. 44–45", q: "now we can thank God", n: "Herr Samsa says this over the body (p. 44). Then he orders the lodgers out, and the family writes three letters of excuse and takes the day off (p. 45)." }
  ];

  var scenes = [
    { p: "p. 3", t: "Gregor wakes as an insect", s: 9, q: "some sort of monstrous insect", n: "The first sentence holds the whole shock. After it, the narrator moves on to the clock, the train and the job (Murphy, 1999, pp. 189–191)." },
    { p: "p. 7", t: "He worries about time and fog", s: 5, q: "Seven o'clock already", n: "His thoughts are about the clock and the weather. A small, ordinary worry sits inside an impossible situation." },
    { p: "pp. 8–10", t: "The general manager at the door", s: 4, q: "let me permit myself to note", n: "The manager uses polite office language. Nobody mentions the insect yet." },
    { p: "p. 13", t: "He opens the door with his mouth", s: 8, q: "I guess I didn't need the locksmith after all", n: "He is pleased with a practical success while the manager backs away in horror." },
    { p: "p. 14", t: "He gives a salesman's speech", s: 7, q: "the only one who had retained his composure", n: "Gregor argues for his job in his new body. Weninger (1993, p. 271): he is composed, the reader is not." },
    { p: "p. 17", t: "The father drives him in with a stick", s: 9, q: "The door was banged shut with the stick", n: "Gregor is wedged in the doorway and bleeding. The sentence reports it plainly." },
    { p: "pp. 31–32", t: "The apples", s: 9, q: "only tolerance", n: "An apple stays in his back for over a month. Afterwards the family owes him only tolerance (p. 32)." },
    { p: "pp. 41–42", t: "Grete: \"get rid of it\"", s: 8, q: "get rid of it", n: "Grete calls him \"it\" (note 1, p. 41). Gregor listens and says nothing." },
    { p: "pp. 43–44", t: "Gregor dies; the father gives thanks", s: 9, q: "now we can thank God", n: "Gregor thinks of his family with love and decides he must disappear (p. 43). The family feels relief (p. 44)." },
    { p: "pp. 46–47", t: "The tram ride and the new future", s: 10, q: "stretched her young body", n: "The family talks about good prospects and a husband for Grete (p. 47). The calm voice makes the ending the most shocking part." }
